<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>RPGmaper - 地图查看器</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a1a; color: #ccc; font: 14px/1.4 sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }

  .toolbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; background: #222; border-bottom: 1px solid #333; flex-shrink: 0; }
  .toolbar label { color: #999; }
  .toolbar input[type=number] { width: 60px; padding: 3px 6px; background: #333; border: 1px solid #444; color: #ccc; border-radius: 3px; }
  .toolbar button { padding: 4px 14px; background: #3a6ea5; border: none; color: #fff; border-radius: 3px; cursor: pointer; }
  .toolbar button:hover { background: #4a7eb5; }
  .toolbar .info { margin-left: auto; color: #888; font-size: 12px; }

  .container { flex: 1; overflow: hidden; position: relative; display: flex; }
  .scroll-area { flex: 1; overflow: auto; position: relative; }
  .canvas-wrap { position: relative; transform-origin: 0 0; }
  canvas { display: block; position: absolute; top: 0; left: 0; }

  .sidebar { width: 280px; background: #222; border-left: 1px solid #333; padding: 12px; overflow-y: auto; flex-shrink: 0; font-size: 12px; }
  .sidebar h3 { color: #999; margin-bottom: 8px; font-size: 13px; }
  .sidebar .sel-list { list-style: none; }
  .sidebar .sel-list li { padding: 2px 6px; margin: 1px 0; background: #2a2a2a; border-radius: 2px; display: flex; justify-content: space-between; cursor: pointer; }
  .sidebar .sel-list li:hover { background: #333; }
  .sidebar .sel-list li .del { color: #c55; cursor: pointer; }
  .sidebar .status { color: #666; font-style: italic; }

  .coord-label { position: absolute; pointer-events: none; color: rgba(255,255,200,0.8); font-size: 10px; text-shadow: 0 0 3px #000; }
</style>
</head>
<body>

<div class="toolbar">
  <label>地图</label>
  <select id="mapSelect" style="background:#333;border:1px solid #444;color:#ccc;padding:3px 6px;border-radius:3px;"></select>
  <label style="margin-left:8px;">传送点</label>
  <input type="checkbox" id="showTransfers" checked>
  <label style="margin-left:8px;">上帝模式</label>
  <input type="checkbox" id="godMode">
  <label style="margin-left:8px;">格子尺寸</label>
  <input type="number" id="tileSize" value="24" min="8" max="96" step="2">
  <label>网格</label>
  <input type="checkbox" id="showGrid" checked>
  <label>标签</label>
  <input type="checkbox" id="showLabels">
  <button id="clearSel">清空选择</button>
  <span style="color:#999;font-size:13px;">缩放: <span id="zoomLevel">100</span>%</span>
  <span class="info" id="status">就绪</span>
</div>

<div class="container">
  <div class="scroll-area" id="scrollArea">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="mapCanvas"></canvas>
      <canvas id="gridCanvas"></canvas>
    </div>
  </div>
  <div class="sidebar">
    <h3>已选择的格子</h3>
    <ul class="sel-list" id="selList"></ul>
    <p class="status" id="selStatus">点击地图选择格子</p>
    <hr style="border-color:#333;margin:12px 0;">
    <h3>操作</h3>
    <button id="saveBtn" style="width:100%;margin-bottom:6px;">下载 selections.json</button>
    <button id="copyBtn" style="width:100%;margin-bottom:6px;">复制选择数据到剪贴板</button>
    <textarea id="jsonPreview" readonly style="width:100%;height:100px;background:#2a2a2a;border:1px solid #444;color:#8c8;padding:4px;font:11px monospace;border-radius:3px;resize:vertical;" placeholder="选择格子后点复制"></textarea>
    <hr style="border-color:#333;margin:12px 0;">
    <h3>传送点管理</h3>
    <p style="color:#666;margin-bottom:6px;" id="editHint">点击传送点跳转，或在下方添加/编辑</p>
    <button id="toggleEditBtn" style="width:100%;margin-bottom:6px;background:#5a7a3a;">✏️ 编辑模式</button>
    <div id="editForm" style="display:none;background:#2a2a2a;padding:8px;border-radius:3px;margin-bottom:6px;">
      <label style="color:#999;font-size:11px;">来源格子 (当前地图)</label>
      <input id="editSrcX" type="number" style="width:45%;background:#333;border:1px solid #444;color:#ccc;padding:2px 4px;">
      <input id="editSrcY" type="number" style="width:45%;background:#333;border:1px solid #444;color:#ccc;padding:2px 4px;">
      <label style="color:#999;font-size:11px;">→ 目标地图</label>
      <input id="editDstMap" type="number" style="width:100%;background:#333;border:1px solid #444;color:#ccc;padding:2px 4px;">
      <label style="color:#999;font-size:11px;">目标坐标</label>
      <input id="editDstX" type="number" style="width:45%;background:#333;border:1px solid #444;color:#ccc;padding:2px 4px;">
      <input id="editDstY" type="number" style="width:45%;background:#333;border:1px solid #444;color:#ccc;padding:2px 4px;">
      <button id="saveTransferBtn" style="width:100%;margin-top:4px;background:#4a6a3a;">保存传送点</button>
    </div>
    <button id="exportTransferBtn" style="width:100%;">导出全部传送数据</button>
  </div>
</div>

<script src="visited_data.js"></script>
<script>
const TILE = 48; // RPG Maker 标准 tile 尺寸

const mapCanvas = document.getElementById('mapCanvas');
const gridCanvas = document.getElementById('gridCanvas');
const ctx = mapCanvas.getContext('2d');
const gctx = gridCanvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');

let img = new Image();
let imgLoaded = false;
let zoom = 1;
let selections = [];
let dragMode = false;
let dragStart = null;

function applyZoom() {
  const wrap = document.getElementById('canvasWrap');
  const area = document.getElementById('scrollArea');
  const z = Math.max(0.05, Math.min(10, zoom));
  wrap.style.transform = 'scale(' + z + ')';
  wrap.style.width = (img.width || 1) + 'px';
  wrap.style.height = (img.height || 1) + 'px';
  document.getElementById('zoomLevel').textContent = Math.round(z * 100);
}

function zoomAt(px, py, factor) {
  const area = document.getElementById('scrollArea');
  const oldZ = zoom;
  zoom = Math.max(0.05, Math.min(10, zoom * factor));
  const ratio = zoom / oldZ;
  area.scrollLeft = (area.scrollLeft + px) * ratio - px;
  area.scrollTop = (area.scrollTop + py) * ratio - py;
  applyZoom();
}

// 加载无缝地图
img.onerror = function() {
  document.getElementById('status').textContent = '加载失败 - 需要先将地图复制到 docs/maps/ 目录';
};
img.onload = function() {
  window._currentTransfers = null;
  mapCanvas.width = img.width;
  mapCanvas.height = img.height;
  gridCanvas.width = img.width;
  gridCanvas.height = img.height;
  drawMap();
  drawGrid();
  applyZoom();
  imgLoaded = true;
  document.getElementById('status').textContent = img.width + 'x' + img.height + 'px 已加载';
};
img.src = 'seamless.png';

// 绘制底图
function drawMap() {
  ctx.drawImage(img, 0, 0);
}

// 绘制网格
function drawGrid() {
  gctx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
  if (!document.getElementById('showGrid').checked) return;
  const tileRender = parseInt(document.getElementById('tileSize').value);
  const w = gridCanvas.width, h = gridCanvas.height;
  gctx.strokeStyle = 'rgba(255,255,255,0.15)';
  gctx.lineWidth = 1;
  for (let x = 0; x <= w; x += TILE) {
    gctx.beginPath(); gctx.moveTo(x, 0); gctx.lineTo(x, h); gctx.stroke();
  }
  for (let y = 0; y <= h; y += TILE) {
    gctx.beginPath(); gctx.moveTo(0, y); gctx.lineTo(w, y); gctx.stroke();
  }
  // 已选择的格子高亮
  selections.forEach(function(s) {
    const px = s.absX * TILE, py = s.absY * TILE;
    gctx.fillStyle = 'rgba(0,180,255,0.25)';
    gctx.fillRect(px, py, TILE, TILE);
    gctx.strokeStyle = 'rgba(0,180,255,0.8)';
    gctx.lineWidth = 2;
    gctx.strokeRect(px, py, TILE, TILE);
  });
  // 传送点
  if (document.getElementById('showTransfers').checked && img._mapId && img._mapId !== 'seamless') {
    var mid = Number(img._mapId);
    var tdata = TRANSFERS[mid];
    // 存储查找表，供点击跳转用
    window._currentTransfers = {};
    var god = document.getElementById('godMode').checked;
    if (tdata) {
      tdata.forEach(function(tr) {
        if (!god && !visitedMaps.has(tr.tid)) return;
        var key = tr.fx + ',' + tr.fy;
        window._currentTransfers[key] = tr;
        // 检查这个传送点是否被使用过
        var used = usedTransfers.some(function(u) {
          return u.fromMap === mid && u.fx === tr.fx && u.fy === tr.fy;
        });
        var px = tr.fx * TILE, py = tr.fy * TILE;
        if (used) {
          gctx.fillStyle = 'rgba(255,200,0,0.5)';
          gctx.fillRect(px, py, TILE, TILE);
          gctx.strokeStyle = 'rgba(255,200,0,0.9)';
          gctx.lineWidth = 2;
          gctx.strokeRect(px, py, TILE, TILE);
          gctx.fillStyle = '#ffcc00';
          gctx.font = 'bold 10px sans-serif';
          gctx.fillText('✓Map' + tr.tid, px + 2, py + 10);
        } else {
          gctx.fillStyle = 'rgba(0,255,100,0.4)';
          gctx.fillRect(px, py, TILE, TILE);
          gctx.strokeStyle = 'rgba(0,255,100,0.9)';
          gctx.lineWidth = 2;
          gctx.strokeRect(px, py, TILE, TILE);
          gctx.fillStyle = 'rgba(0,255,100,0.9)';
          gctx.font = 'bold 10px sans-serif';
          gctx.fillText('→Map' + tr.tid, px + 2, py + 10);
        }
      });
    }
  }

  // 标签
  if (document.getElementById('showLabels').checked) {
    gctx.fillStyle = 'rgba(255,255,200,0.6)';
    gctx.font = '9px sans-serif';
    for (let y = 0; y < h; y += TILE * 4) {
      for (let x = 0; x < w; x += TILE * 4) {
        const tx = Math.floor(x / TILE), ty = Math.floor(y / TILE);
        gctx.fillText('(' + tx + ',' + ty + ')', x + 2, y + 10);
      }
    }
  }
}

// 点击处理
function handleClick(e) {
  const rect = gridCanvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / zoom;
  const my = (e.clientY - rect.top) / zoom;
  const tx = Math.floor(mx / TILE);
  const ty = Math.floor(my / TILE);
  if (tx < 0 || ty < 0 || tx * TILE >= img.width || ty * TILE >= img.height) return;

  // 编辑模式下点击填来源坐标
  var editMode = document.getElementById('toggleEditBtn').dataset.active === '1';
  if (editMode && img._mapId !== 'seamless') {
    var lok = localTile(tx, ty);
    document.getElementById('editSrcX').value = lok.x;
    document.getElementById('editSrcY').value = lok.y;
    document.getElementById('status').textContent = '已选来源: (' + lok.x + ',' + lok.y + ')，填写目标后保存';
    return;
  }

  // 点击传送点 → 跳转目标地图
  if (!editMode && window._currentTransfers && img._mapId !== 'seamless') {
    var lok = localTile(tx, ty);
    var key = lok.x + ',' + lok.y;
    var tr = window._currentTransfers[key];
    if (tr) {
      if (!document.getElementById('godMode').checked) visitMap(tr.tid);
      document.getElementById('mapSelect').value = String(tr.tid);
      loadMap(tr.tid);
      return;
    }
  }

  // 普通选择
  const existing = selections.findIndex(function(s) { return s.absX === tx && s.absY === ty; });
  if (existing >= 0) {
    selections.splice(existing, 1);
  } else {
    const mapInfo = findMapAt(tx, ty);
    var loc = localTile(tx, ty);
    selections.push({
      mapId: mapInfo ? mapInfo.id : null,
      tileX: loc.x,
      tileY: loc.y,
      absX: tx,
      absY: ty,
      absPx: tx * TILE,
      absPy: ty * TILE
    });
  }
  updateUI();
}

// 查找某个绝对坐标属于哪张地图
function findMapAt(absX, absY) {
  for (var i = 0; i < MAP_LIST.length; i++) {
    var m = MAP_LIST[i];
    var off = OFFSETS[m.id];
    if (!off) continue;
    if (absX >= off[0] && absX < off[0] + m.w &&
        absY >= off[1] && absY < off[1] + m.h) {
      return {id: m.id, ox: off[0], oy: off[1]};
    }
  }
  return null;
}

// 显示 tileX/tileY 时：单图模式下 abs=本地坐标，无缝模式下才需要减偏移
function localTile(absX, absY) {
  if (img._mapId === 'seamless') {
    var info = findMapAt(absX, absY);
    return info ? {x: absX - info.ox, y: absY - info.oy} : {x: absX, y: absY};
  }
  return {x: absX, y: absY}; // 单图模式，绝对坐标就是本地坐标
}

function updateUI() {
  drawGrid();
  renderSidebar();
  document.getElementById('selStatus').textContent = selections.length + ' 个格子已选择';
}

function renderSidebar() {
  const list = document.getElementById('selList');
  list.innerHTML = '';
  selections.forEach(function(s, i) {
    const li = document.createElement('li');
    li.innerHTML = '<span>(' + s.absX + ',' + s.absY + ')' +
      (s.mapId ? ' Map' + s.mapId + '[' + s.tileX + ',' + s.tileY + ']' : '') +
      '</span><span class="del" data-i="' + i + '">✕</span>';
    li.querySelector('.del').addEventListener('click', function(e) {
      e.stopPropagation();
      selections.splice(parseInt(this.dataset.i), 1);
      updateUI();
    });
    list.appendChild(li);
  });
}

// 事件绑定
gridCanvas.addEventListener('click', handleClick);

document.getElementById('clearSel').addEventListener('click', function() {
  selections = [];
  updateUI();
});

document.getElementById('tileSize').addEventListener('change', drawGrid);
document.getElementById('showGrid').addEventListener('change', drawGrid);
document.getElementById('showLabels').addEventListener('change', drawGrid);
document.getElementById('showTransfers').addEventListener('change', drawGrid);

document.getElementById('saveBtn').addEventListener('click', function() {
  const data = JSON.stringify(selections, null, 2);
  // 下载到本地
  const blob = new Blob([data], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'selections.json';
  a.click();
  document.getElementById('status').textContent = '已保存 selections.json';
});

document.getElementById('copyBtn').addEventListener('click', function() {
  const data = JSON.stringify(selections, null, 2);
  document.getElementById('jsonPreview').value = data;
  document.getElementById('jsonPreview').select();
  navigator.clipboard.writeText(data).then(function() {
    document.getElementById('status').textContent = '已复制 ' + selections.length + ' 个格子';
  }).catch(function() {
    document.getElementById('status').textContent = '复制失败，请手动复制文本框内容';
  });
});

// 缩放快捷键
document.addEventListener('keydown', function(e) {
  const area = document.getElementById('scrollArea');
  const rect = area.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  if (e.ctrlKey && e.key === '=') { e.preventDefault(); zoomAt(cx, cy, 1.3); }
  if (e.ctrlKey && e.key === '-') { e.preventDefault(); zoomAt(cx, cy, 1/1.3); }
  if (e.ctrlKey && e.key === '0') { e.preventDefault(); zoom = 1; applyZoom(); }
});

// 鼠标滚轮缩放（Ctrl+滚轮）
document.getElementById('scrollArea').addEventListener('wheel', function(e) {
  if (!e.ctrlKey) return;
  e.preventDefault();
  const rect = this.getBoundingClientRect();
  zoomAt(e.clientX - rect.left, e.clientY - rect.top, e.deltaY > 0 ? 1/1.15 : 1.15);
}, {passive: false});

// 编辑模式切换
document.getElementById('toggleEditBtn').addEventListener('click', function() {
  var active = this.dataset.active === '1' ? '0' : '1';
  this.dataset.active = active;
  this.style.background = active === '1' ? '#8a3a3a' : '#5a7a3a';
  this.textContent = active === '1' ? '✏️ 编辑中...' : '✏️ 编辑模式';
  document.getElementById('editForm').style.display = active === '1' ? 'block' : 'none';
  document.getElementById('editHint').textContent = active === '1' ? '点击地图格子选择来源坐标' : '点击传送点跳转，或在下方添加';
  if (active !== '1') {
    window._currentTransfers = null;
    drawGrid();
  }
});

// 保存传送点
document.getElementById('saveTransferBtn').addEventListener('click', function() {
  var mid = Number(img._mapId);
  if (!mid || mid === 'seamless') { document.getElementById('status').textContent = '请在单图模式下编辑'; return; }
  var sx = parseInt(document.getElementById('editSrcX').value);
  var sy = parseInt(document.getElementById('editSrcY').value);
  var dm = parseInt(document.getElementById('editDstMap').value);
  var dx = parseInt(document.getElementById('editDstX').value);
  var dy = parseInt(document.getElementById('editDstY').value);
  if (isNaN(sx)||isNaN(sy)||isNaN(dm)||isNaN(dx)||isNaN(dy)) {
    document.getElementById('status').textContent = '请填完整';
    return;
  }
  if (!TRANSFERS[mid]) TRANSFERS[mid] = [];
  TRANSFERS[mid] = TRANSFERS[mid].filter(function(t){return !(t.fx===sx&&t.fy===sy&&t.tid===dm);});
  TRANSFERS[mid].push({fx:sx,fy:sy,tid:dm,tx:dx,ty:dy});
  if (!document.getElementById('godMode').checked) visitMap(dm);
  drawGrid();
  document.getElementById('status').textContent = '已保存 Map' + mid + '(' + sx + ',' + sy + ')→Map' + dm;
});

// 导出传送数据
document.getElementById('exportTransferBtn').addEventListener('click', function() {
  var data = JSON.stringify(TRANSFERS, null, 2);
  var blob = new Blob([data], {type: 'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'transfers.json';
  a.click();
  document.getElementById('status').textContent = '已导出 transfers.json';
});


function loadMap(mapId) {
  var f = mapId === 'seamless' ? 'seamless.png' : 'Map' + String(mapId).padStart(4, '0') + '.png';
  var path = mapId === 'seamless' ? 'seamless.png' : 'maps/' + f;
  img.src = path;
  img._mapId = mapId;
  document.getElementById('status').textContent = '加载 ' + f + '...';
}

// 地图列表（内嵌数据，避免 file:// 下 fetch 被拦截）
var MAP_LIST = [{"id":1,"w":17,"h":13,"link":false},{"id":2,"w":17,"h":13,"link":true},{"id":3,"w":61,"h":101,"link":true},{"id":5,"w":28,"h":16,"link":true},{"id":6,"w":17,"h":13,"link":false},{"id":7,"w":28,"h":29,"link":true},{"id":9,"w":17,"h":13,"link":false},{"id":10,"w":17,"h":13,"link":true},{"id":13,"w":17,"h":13,"link":false},{"id":14,"w":17,"h":13,"link":false},{"id":15,"w":17,"h":13,"link":false},{"id":16,"w":35,"h":52,"link":true},{"id":17,"w":17,"h":13,"link":false},{"id":18,"w":17,"h":13,"link":false},{"id":25,"w":17,"h":13,"link":true},{"id":26,"w":47,"h":39,"link":true},{"id":27,"w":17,"h":13,"link":true},{"id":28,"w":17,"h":13,"link":true},{"id":29,"w":17,"h":13,"link":true},{"id":30,"w":17,"h":13,"link":true},{"id":31,"w":17,"h":13,"link":true},{"id":33,"w":17,"h":13,"link":true},{"id":34,"w":17,"h":13,"link":true},{"id":35,"w":17,"h":13,"link":true},{"id":38,"w":17,"h":13,"link":true},{"id":39,"w":17,"h":13,"link":true},{"id":40,"w":17,"h":13,"link":true},{"id":43,"w":27,"h":27,"link":true},{"id":44,"w":17,"h":13,"link":true},{"id":51,"w":17,"h":13,"link":false},{"id":53,"w":55,"h":35,"link":true},{"id":54,"w":33,"h":26,"link":true},{"id":55,"w":17,"h":13,"link":true},{"id":56,"w":17,"h":13,"link":false},{"id":66,"w":45,"h":45,"link":true},{"id":68,"w":61,"h":101,"link":true},{"id":75,"w":17,"h":13,"link":false},{"id":76,"w":17,"h":13,"link":true},{"id":83,"w":21,"h":26,"link":true},{"id":91,"w":48,"h":28,"link":true},{"id":93,"w":17,"h":13,"link":true},{"id":107,"w":39,"h":44,"link":true},{"id":109,"w":61,"h":101,"link":true},{"id":114,"w":27,"h":15,"link":false},{"id":116,"w":25,"h":30,"link":true},{"id":117,"w":27,"h":28,"link":true},{"id":118,"w":17,"h":13,"link":false},{"id":120,"w":70,"h":50,"link":false},{"id":125,"w":17,"h":28,"link":true},{"id":137,"w":70,"h":50,"link":true},{"id":138,"w":17,"h":13,"link":false},{"id":139,"w":17,"h":13,"link":true},{"id":142,"w":17,"h":13,"link":false},{"id":144,"w":35,"h":52,"link":true},{"id":145,"w":16,"h":23,"link":true},{"id":148,"w":17,"h":13,"link":true},{"id":149,"w":17,"h":13,"link":false},{"id":152,"w":44,"h":43,"link":true},{"id":154,"w":17,"h":13,"link":true},{"id":157,"w":81,"h":60,"link":true},{"id":251,"w":26,"h":18,"link":true},{"id":252,"w":19,"h":20,"link":true},{"id":260,"w":47,"h":39,"link":true},{"id":262,"w":17,"h":13,"link":true},{"id":264,"w":26,"h":25,"link":true},{"id":268,"w":17,"h":13,"link":true},{"id":270,"w":18,"h":14,"link":true},{"id":271,"w":14,"h":10,"link":true},{"id":272,"w":17,"h":13,"link":false},{"id":273,"w":35,"h":52,"link":true},{"id":274,"w":18,"h":16,"link":true},{"id":280,"w":17,"h":13,"link":false},{"id":281,"w":34,"h":27,"link":true}];

// 已探索地图 & 已使用传送点
var visitedMaps = new Set();
var usedTransfers = [];

// 从 watch-game 自动记录的数据加载
if (typeof VISITED_MAPS !== 'undefined') {
  VISITED_MAPS.forEach(function(id){ visitedMaps.add(id); });
}
if (typeof USED_TRANSFERS !== 'undefined') {
  usedTransfers = USED_TRANSFERS;
}

// 从 localStorage 补充（手动访问的记录）
try {
  var saved = JSON.parse(localStorage.getItem('rpgmaper_visited') || '[]');
  saved.forEach(function(id){ visitedMaps.add(id); });
} catch(e) {}

function visitMap(id) {
  if (!id || id === 'seamless') return;
  id = Number(id);
  if (!visitedMaps.has(id)) {
    visitedMaps.add(id);
    try { localStorage.setItem('rpgmaper_visited', JSON.stringify(Array.from(visitedMaps))); } catch(e) {}
    rebuildDropdown();
  }
}

function rebuildDropdown() {
  var sel = document.getElementById('mapSelect');
  if (!sel) { setTimeout(rebuildDropdown, 50); return; }
  var currentVal = sel.value;
  var god = document.getElementById('godMode') ? document.getElementById('godMode').checked : true;
  // 清空
  sel.options.length = 0;
  // 无缝图
  sel.options[0] = new Option('📷 无缝图', 'seamless');
  var idx = 1;
  // 地图列表
  MAP_LIST.forEach(function(m) {
    if (!god && !visitedMaps.has(m.id)) return;
    var label = 'Map' + m.id + ' (' + m.w + 'x' + m.h + ')';
    if (!god) label = (m.link ? '🔗 ' : '  ') + label;
    else if (m.link) label = label + ' 🔗';
    if (!god && visitedMaps.has(m.id)) label = '✓ ' + label;
    sel.options[idx++] = new Option(label, '' + m.id);
  });
  // 恢复选中
  if (currentVal) {
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === currentVal) { sel.selectedIndex = i; return; }
    }
  }
  sel.selectedIndex = 0;
}

// 初始化
var allMapIds = MAP_LIST.map(function(m){return m.id;});
var defaultMap = 3;

// 如果 watch-game 记录了已探索地图就用它，否则 fallback
if (visitedMaps.size === 0) {
  visitedMaps.add(3);
  // 自动开上帝模式（初次使用没有任何记录）
  document.getElementById('godMode').checked = true;
} else {
  // 有记录 → 默认用第一个已探索地图
  defaultMap = Array.from(visitedMaps).sort(function(a,b){return a-b})[0];
}
try { localStorage.setItem('rpgmaper_visited', JSON.stringify(Array.from(visitedMaps))); } catch(e) {}

// 确保 DOM 就绪后初始化下拉框
function initDropdown() {
  var sel = document.getElementById('mapSelect');
  if (!sel) { setTimeout(initDropdown, 50); return; }
  rebuildDropdown();
  // 选第一个已探索地图
  for (var i = 0; i < sel.options.length; i++) {
    if (sel.options[i].value === String(defaultMap)) { sel.selectedIndex = i; break; }
  }
  loadMap(defaultMap);
}
initDropdown();
