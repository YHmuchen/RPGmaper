<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>RPGmaper</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #1a1a1a; color: #ccc; font: 14px/1.4 sans-serif;
  height: 100vh; display: flex; flex-direction: column;
}

header {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px; background: #222; border-bottom: 1px solid #333;
}
header h1 { font-size: 18px; font-weight: normal; color: #7a7; }
header button {
  padding: 6px 16px; border: none; border-radius: 4px;
  cursor: pointer; font-size: 13px;
}
header button.primary { background: #3a6ea5; color: #fff; }
header button.primary:hover { background: #4a7eb5; }
header .right { margin-left: auto; }

.project-list { flex: 1; overflow-y: auto; padding: 16px 20px; }
.project-empty { text-align: center; padding: 60px 20px; color: #555; }
.project-empty .big { font-size: 48px; margin-bottom: 12px; }
.project-empty p { margin: 4px 0; }

.project-card {
  background: #222; border: 1px solid #333; border-radius: 6px;
  padding: 16px; margin-bottom: 12px;
}
.project-card .head {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 10px;
}
.project-card .head h2 { font-size: 15px; font-weight: normal; flex: 1; }
.project-card .head .status { font-size: 12px; color: #666; }
.project-card .stats {
  display: flex; gap: 20px; margin-bottom: 10px; font-size: 13px;
}
.project-card .stats span { color: #888; }
.project-card .stats strong { color: #ccc; }
.project-card .actions {
  display: flex; gap: 8px; flex-wrap: wrap;
}
.project-card .actions button {
  padding: 4px 12px; border: none; border-radius: 3px;
  cursor: pointer; font-size: 12px;
}
.btn-ts { background: #5a7a3a; color: #fff; }
.btn-ts:hover { background: #6a8a4a; }
.btn-map { background: #3a6ea5; color: #fff; }
.btn-map:hover { background: #4a7eb5; }
.btn-all { background: #7a5a3a; color: #fff; }
.btn-all:hover { background: #8a6a4a; }
.btn-del { background: #5a3a3a; color: #c88; }
.btn-del:hover { background: #6a4a4a; }

.log-panel {
  border-top: 1px solid #333; background: #111;
  padding: 10px 16px; max-height: 160px; overflow-y: auto;
  font: 12px/1.5 monospace; color: #888;
}
.log-panel .log-line { white-space: pre-wrap; word-break: break-all; }
.log-panel .log-line.done { color: #6a6; }
.log-panel .log-line.err { color: #c66; }
.log-panel .log-line.info { color: #888; }
</style>
</head>
<body>

<header>
  <h1>🗺️ RPGmaper</h1>
  <button class="primary" id="addBtn">＋ 添加游戏</button>
  <span class="right" id="statusBar" style="color:#666;font-size:12px;"></span>
</header>

<div class="project-list" id="projectList">
  <div class="project-empty" id="emptyHint">
    <div class="big">🗺️</div>
    <p>还没有添加任何游戏</p>
    <p style="font-size:12px;">点击上方「添加游戏」按钮选择游戏目录</p>
  </div>
</div>

<div class="log-panel" id="logPanel">
  <div class="log-line info">就绪</div>
</div>

<script>
const { electronAPI } = window;

// ─── 日志 ─────────────────────────────────────────────────────
function log(text, type) {
  const panel = document.getElementById('logPanel');
  const line = document.createElement('div');
  line.className = 'log-line ' + (type || '');
  line.textContent = text;
  panel.appendChild(line);
  panel.scrollTop = panel.scrollHeight;
}

// ─── 项目卡片 ─────────────────────────────────────────────────
function createProjectCard(p) {
  const card = document.createElement('div');
  card.className = 'project-card';
  card.innerHTML = `
    <div class="head">
      <h2>📁 ${p.name}</h2>
      <span class="status">tileset ${p.tilesets} 张 · 地图 ${p.maps} 张</span>
    </div>
    <div class="stats">
      <span>Tileset: <strong id="tsCount_${p.name}">${p.tilesets}</strong></span>
      <span>地图: <strong id="mapCount_${p.name}">${p.maps}</strong></span>
    </div>
    <div class="actions">
      <button class="btn-ts" data-name="${p.name}">导出 tileset</button>
      <button class="btn-map" data-name="${p.name}">渲染地图</button>
      <button class="btn-all" data-name="${p.name}">▶ 全流程</button>
      <button class="btn-del" data-name="${p.name}" style="margin-left:auto;">删除</button>
    </div>
  `;

  // 记录游戏目录
  card.dataset.gameDir = '';

  // 按钮事件
  card.querySelector('.btn-ts').addEventListener('click', () => runOne(p.name, 'tilesets'));
  card.querySelector('.btn-map').addEventListener('click', () => runOne(p.name, 'maps'));
  card.querySelector('.btn-all').addEventListener('click', () => runAll(p.name));
  card.querySelector('.btn-del').addEventListener('click', async () => {
    if (!confirm(`删除项目「${p.name}」？所有数据将被移除。`)) return;
    await electronAPI.deleteProject(p.name);
    refreshList();
  });

  return card;
}

// 项目 → 游戏目录映射（从项目名推算）
async function getGameDir(projectName) {
  // 从 test-report.json 或已知信息中获取
  // 暂时通过 IPC 无法反向获取，在项目添加时保存
  const stored = localStorage.getItem('gameDirs');
  const dirs = stored ? JSON.parse(stored) : {};
  return dirs[projectName] || '';
}

// ─── 执行脚本 ─────────────────────────────────────────────────
async function runOne(projectName, script) {
  const stored = JSON.parse(localStorage.getItem('gameDirs') || '{}');
  const gameDir = stored[projectName];
  if (!gameDir) {
    log(`项目「${projectName}」未关联游戏目录，请在添加时指定`, 'err');
    return;
  }

  const label = script === 'tilesets' ? '导出 tileset' : '渲染地图';
  log(`▶ [${projectName}] ${label}...`, 'info');
  document.getElementById('statusBar').textContent = `正在${label}...`;

  await electronAPI.runScript(script, gameDir);
  refreshList();
  document.getElementById('statusBar').textContent = `${label} 完成`;
  log(`✔ [${projectName}] ${label} 完成`, 'done');
}

async function runAll(projectName) {
  const stored = JSON.parse(localStorage.getItem('gameDirs') || '{}');
  const gameDir = stored[projectName];
  if (!gameDir) {
    log(`项目「${projectName}」未关联游戏目录`, 'err');
    return;
  }

  log(`▶ [${projectName}] 全流程开始...`, 'info');
  document.getElementById('statusBar').textContent = '全流程执行中...';

  await electronAPI.runScript('tilesets', gameDir);
  log(`✔ [${projectName}] tileset 导出完成`, 'done');

  await electronAPI.runScript('maps', gameDir);
  log(`✔ [${projectName}] 地图渲染完成`, 'done');

  refreshList();
  document.getElementById('statusBar').textContent = '全流程完成';
  log(`✅ [${projectName}] 全流程完成`, 'done');
}

// ─── 刷新列表 ─────────────────────────────────────────────────
async function refreshList() {
  const list = document.getElementById('projectList');
  const projects = await electronAPI.scanProjects();

  if (projects.length === 0) {
    list.innerHTML = `
      <div class="project-empty" id="emptyHint">
        <div class="big">🗺️</div>
        <p>还没有添加任何游戏</p>
        <p style="font-size:12px;">点击上方「添加游戏」按钮选择游戏目录</p>
      </div>`;
    return;
  }

  list.innerHTML = '';
  projects.forEach(p => list.appendChild(createProjectCard(p)));
}

// ─── 添加项目 ─────────────────────────────────────────────────
document.getElementById('addBtn').addEventListener('click', async () => {
  const projects = await electronAPI.addProject();
  refreshList();
});

electronAPI.onProjectAdded(data => {
  // 保存游戏目录映射
  const stored = JSON.parse(localStorage.getItem('gameDirs') || '{}');
  stored[data.name] = data.gameDir;
  localStorage.setItem('gameDirs', JSON.stringify(stored));
  log(`✔ 已添加项目: ${data.name}`, 'done');
});

// ─── 脚本输出 ─────────────────────────────────────────────────
electronAPI.onScriptOutput(data => {
  if (data.text) log(data.text, 'info');
});

electronAPI.onScriptDone(data => {
  if (!data.ok && data.error) {
    log(`✗ ${data.error.substring(0, 200)}`, 'err');
  }
});

// ─── 初始加载 ─────────────────────────────────────────────────
refreshList();
</script>
</body>
</html>
