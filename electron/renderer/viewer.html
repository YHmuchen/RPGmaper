<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>RPGmaper - 地图查看器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a1a; color: #ccc; font: 14px/1.4 sans-serif; overflow: hidden; height: 100vh; display: flex; flex-direction: column; }
.toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: #222; border-bottom: 1px solid #333; flex-shrink: 0; flex-wrap: wrap; }
.toolbar label { color: #999; font-size: 13px; }
.toolbar select { background:#333;border:1px solid #444;color:#ccc;padding:3px 6px;border-radius:3px; }
.toolbar button { padding: 4px 14px; border: none; border-radius: 3px; cursor: pointer; font-size: 13px; background: #3a6ea5; color: #fff; }
.toolbar button:hover { background: #4a7eb5; }
.toolbar input[type=number] { width: 50px; padding: 3px 6px; background: #333; border: 1px solid #444; color: #ccc; border-radius: 3px; }
.toolbar input[type=checkbox] { margin: 0; }
.toolbar .info { margin-left: auto; color: #888; font-size: 12px; }
.container { flex: 1; overflow: hidden; position: relative; display: flex; }
.scroll-area { flex: 1; overflow: auto; position: relative; }
.canvas-wrap { position: relative; transform-origin: 0 0; }
canvas { display: block; position: absolute; top: 0; left: 0; }
.sidebar { width: 260px; background: #222; border-left: 1px solid #333; padding: 12px; overflow-y: auto; flex-shrink: 0; font-size: 12px; }
.sidebar h3 { color: #999; margin-bottom: 8px; font-size: 13px; }
.sidebar .sel-list { list-style: none; }
.sidebar .sel-list li { padding: 2px 6px; margin: 1px 0; background: #2a2a2a; border-radius: 2px; display: flex; justify-content: space-between; cursor: pointer; }
.sidebar .sel-list li:hover { background: #333; }
.sidebar .sel-list li .del { color: #c55; cursor: pointer; }
.sidebar .status { color: #666; font-style: italic; }
</style>
</head>
<body>

<div class="toolbar">
  <span style="color:#888;font-size:13px;" id="projectName"></span>
  <label>地图</label>
  <select id="mapSelect" style="min-width:140px;"><option value="">—</option></select>
  <label>传送点</label>
  <input type="checkbox" id="showTransfers" checked>
  <label>网格</label>
  <input type="checkbox" id="showGrid" checked>
  <label>标签</label>
  <input type="checkbox" id="showLabels">
  <span>缩放: <span id="zoomLevel">100</span>%</span>
  <button id="clearSel">清空选择</button>
  <span class="info" id="status">就绪</span>
</div>

<div class="container">
  <div class="scroll-area" id="scrollArea">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="mapCanvas"></canvas>
      <canvas id="gridCanvas"></canvas>
    </div>
  </div>
  <div class="sidebar">
    <h3>已选择的格子</h3>
    <ul class="sel-list" id="selList"></ul>
    <p class="status" id="selStatus">点击地图选择格子</p>
    <hr style="border-color:#333;margin:12px 0;">
    <h3>操作</h3>
    <button id="saveBtn" style="width:100%;margin-bottom:6px;">下载 selections.json</button>
    <button id="copyBtn" style="width:100%;margin-bottom:6px;">复制到剪贴板</button>
    <textarea id="jsonPreview" readonly style="width:100%;height:80px;background:#2a2a2a;border:1px solid #444;color:#8c8;padding:4px;font:11px monospace;border-radius:3px;resize:vertical;" placeholder="选择格子后点复制"></textarea>
    <hr style="border-color:#333;margin:12px 0;">
    <h3>传送点管理</h3>
    <button id="exportTransferBtn" style="width:100%;">导出全部传送数据</button>
    <hr style="border-color:#333;margin:12px 0;">
    <p style="color:#555;font-size:11px;" id="statusExtra"></p>
  </div>
</div>

<script>
// ─── 获取项目信息（从 URL query） ─────────────────────────────
const params = new URLSearchParams(window.location.search);
const PROJECT_NAME = params.get('name') || '';
const GAME_DIR = params.get('gameDir') || '';
const PROJECT_DIR = params.get('projectDir') || '';

// ─── 状态 ─────────────────────────────────────────────────────
const TILE = 48, HALF = 24;
const mapCanvas = document.getElementById('mapCanvas');
const gridCanvas = document.getElementById('gridCanvas');
const ctx = mapCanvas.getContext('2d');
const gctx = gridCanvas.getContext('2d');
const wrap = document.getElementById('canvasWrap');

let img = new Image();
let zoom = 1;
let selections = [];
let MAP_LIST = [];
let PARALLAX_MAPS = {};
let TRANSFERS = {};
let _entrySource = null; // { fromMap, fromFx, fromFy, toMap, toTx, toTy }
let _skipSelectChange = false;

document.getElementById('projectName').textContent = '🗺️ ' + PROJECT_NAME;

// ─── IPC 加载数据 ──────────────────────────────────────────────
async function loadData() {
  // 加载地图列表
  const infos = await electronAPI.loadMapInfos(GAME_DIR);
  if (infos) {
    MAP_LIST = [];
    for (let i = 1; i < infos.length; i++) {
      if (infos[i]) {
        const dim = await electronAPI.getMapDimensions(GAME_DIR, i);
        MAP_LIST.push({ id: i, name: infos[i].name || ('Map' + i), w: dim ? dim.w : 17, h: dim ? dim.h : 13 });
      }
    }
  }

  // 加载传送点
  try {
    const transfersJS = await electronAPI.readDataFile(PROJECT_DIR + '/transfers_data.js');
    if (transfersJS) {
      const m = transfersJS.match(/var TRANSFERS_ALL = ([\s\S]*?);/);
      if (m) TRANSFERS = JSON.parse(m[1]);
    }
  } catch(e) {}

  // 加载视差图
  PARALLAX_MAPS = await electronAPI.getParallaxMaps(GAME_DIR) || {};

  // 更新下拉框
  updateDropdown();
}

// ─── 下拉框 ───────────────────────────────────────────────────
function updateDropdown() {
  const sel = document.getElementById('mapSelect');
  sel.options.length = 0;
  MAP_LIST.forEach(m => {
    sel.options[sel.options.length] = new Option('Map' + m.id + ' (' + m.w + '×' + m.h + ')', String(m.id));
  });
  if (MAP_LIST.length > 0) { sel.selectedIndex = 0; loadMap(MAP_LIST[0].id); }
}

// ─── 地图加载 ─────────────────────────────────────────────────
function resolveMapPath(mapId) {
  const pName = PARALLAX_MAPS[mapId];
  const pad = String(mapId).padStart(4, '0');
  if (pName) {
    const safe = pName.replace(/[\/:*?"<>|]/g, '_');
    return 'file:///' + PROJECT_DIR.replace(/\\/g, '/') + '/parallax/parallax_' + safe + '.png';
  }
  return 'file:///' + PROJECT_DIR.replace(/\\/g, '/') + '/maps/Map' + pad + '.png';
}

function loadMap(mapId, entrySource) {
  mapId = Number(mapId);
  _entrySource = entrySource || null;
  const path = resolveMapPath(mapId);
  img.onerror = function() {
    document.getElementById('status').textContent = '地图 ' + mapId + ' 不存在，请先生成地图数据';
  };
  img.onload = function() {
    window._currentMapId = mapId;
    mapCanvas.width = img.width;
    mapCanvas.height = img.height;
    gridCanvas.width = img.width;
    gridCanvas.height = img.height;
    drawMap();
    drawGrid();
    applyZoom();
    imgLoaded = true;
    document.getElementById('status').textContent = img.width + '×' + img.height + 'px';
  };
  img.src = path;
  // 如果图片已缓存，onload 可能在上面的 src 赋值时同步触发，
  // 但那时 _entrySource 可能被 change 事件提前清了。
  // 确保 entrySource 生效后重绘。
  if (entrySource && img.complete && img.naturalWidth > 0) {
    window._currentMapId = mapId;
    drawGrid();
  }
}

// ─── 绘制 ─────────────────────────────────────────────────────
function drawMap() { ctx.drawImage(img, 0, 0); }

function drawGrid() {
  gctx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
  if (!document.getElementById('showGrid').checked) return;
  const w = gridCanvas.width, h = gridCanvas.height;
  gctx.strokeStyle = 'rgba(255,255,255,0.15)';
  gctx.lineWidth = 1;
  for (let x = 0; x <= w; x += TILE) { gctx.beginPath(); gctx.moveTo(x, 0); gctx.lineTo(x, h); gctx.stroke(); }
  for (let y = 0; y <= h; y += TILE) { gctx.beginPath(); gctx.moveTo(0, y); gctx.lineTo(w, y); gctx.stroke(); }
  // 选择
  selections.forEach(s => {
    const px = s.absX * TILE, py = s.absY * TILE;
    gctx.fillStyle = 'rgba(0,180,255,0.25)';
    gctx.fillRect(px, py, TILE, TILE);
    gctx.strokeStyle = 'rgba(0,180,255,0.8)';
    gctx.lineWidth = 2;
    gctx.strokeRect(px, py, TILE, TILE);
  });
  // 传送点
  const mid = window._currentMapId;
  if (document.getElementById('showTransfers').checked && mid && !isNaN(mid)) {
    const tdata = TRANSFERS[Number(mid)];
    window._currentTransfers = {};
    if (tdata) {
      tdata.forEach(tr => {
        const key = tr.fx + ',' + tr.fy;
        if (!window._currentTransfers[key]) window._currentTransfers[key] = [];
        window._currentTransfers[key].push(tr);
      });
      for (const key in window._currentTransfers) {
        const trs = window._currentTransfers[key];
        const first = trs[0];
        const px = first.fx * TILE, py = first.fy * TILE;
        const isPureCE = trs.every(t => t.source && t.source.indexOf('commonEvent') === 0);
        // 匹配回头传送点：tid=来源地图 且传送点位置在落点±2格内
        const isEntry = _entrySource && Number(_entrySource.toMap) === Number(mid)
          && trs.some(t => Number(t.tid) === Number(_entrySource.fromMap)
            && Math.abs(Number(t.fx) - Number(_entrySource.toTx)) <= 2
            && Math.abs(Number(t.fy) - Number(_entrySource.toTy)) <= 2);
        let textColor;
        if (isEntry) {
          // 黄 = 可回到来源地图的传送点
          gctx.fillStyle = 'rgba(255,200,0,0.5)';
          gctx.strokeStyle = 'rgba(255,200,0,0.9)';
          textColor = '#ffcc00';
        } else if (isPureCE) {
          // 蓝 = 纯公共事件
          gctx.fillStyle = 'rgba(0,150,255,0.4)';
          gctx.strokeStyle = 'rgba(0,150,255,0.9)';
          textColor = 'rgba(0,180,255,0.9)';
        } else {
          // 绿 = 直接地图传送
          gctx.fillStyle = 'rgba(0,255,100,0.4)';
          gctx.strokeStyle = 'rgba(0,255,100,0.9)';
          textColor = 'rgba(0,255,100,0.9)';
        }
        gctx.fillRect(px, py, TILE, TILE);
        gctx.strokeRect(px, py, TILE, TILE);
        const tids = [...new Set(trs.map(t => 'Map' + t.tid))];
        if (isEntry) tids.unshift('◀');
        gctx.fillStyle = textColor;
        gctx.font = 'bold 9px sans-serif';
        gctx.fillText(tids.join('/'), px + 2, py + 10);
      }
    }
  }
  // 标签
  if (document.getElementById('showLabels').checked) {
    gctx.fillStyle = 'rgba(255,255,200,0.6)';
    gctx.font = '9px sans-serif';
    for (let y = 0; y < h; y += TILE * 4)
      for (let x = 0; x < w; x += TILE * 4)
        gctx.fillText('(' + Math.floor(x/TILE) + ',' + Math.floor(y/TILE) + ')', x + 2, y + 10);
  }
}

function applyZoom() {
  const z = Math.max(0.05, Math.min(10, zoom));
  wrap.style.transform = 'scale(' + z + ')';
  wrap.style.width = (img.width || 1) + 'px';
  wrap.style.height = (img.height || 1) + 'px';
  document.getElementById('zoomLevel').textContent = Math.round(z * 100);
}

// ─── 交互 ─────────────────────────────────────────────────────
gridCanvas.addEventListener('click', function(e) {
  const rect = gridCanvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / zoom;
  const my = (e.clientY - rect.top) / zoom;
  const tx = Math.floor(mx / TILE), ty = Math.floor(my / TILE);
  if (tx < 0 || ty < 0 || tx * TILE >= img.width || ty * TILE >= img.height) return;
  const mid = window._currentMapId;
  // 传送点击
  if (mid && !isNaN(mid)) {
    const key = tx + ',' + ty;
    const trs = window._currentTransfers && window._currentTransfers[key];
    if (trs && trs.length > 0) {
      if (trs.length === 1) {
        loadMap(trs[0].tid, { fromMap: Number(mid), fromFx: Number(tx), fromFy: Number(ty), toMap: Number(trs[0].tid), toTx: Number(trs[0].tx), toTy: Number(trs[0].ty) });
        _skipSelectChange = true;
        document.getElementById('mapSelect').value = String(trs[0].tid);
      } else {
        showTransferMenu(trs, tr => {
          loadMap(tr.tid, { fromMap: Number(mid), fromFx: Number(tx), fromFy: Number(ty), toMap: Number(tr.tid), toTx: Number(tr.tx), toTy: Number(tr.ty) });
          _skipSelectChange = true;
          document.getElementById('mapSelect').value = String(tr.tid);
        });
      }
      return;
    }
  }
  // 选择
  const idx = selections.findIndex(s => s.absX === tx && s.absY === ty);
  if (idx >= 0) selections.splice(idx, 1);
  else selections.push({ mapId: mid, absX: tx, absY: ty });
  updateUI();
});

function showTransferMenu(trs, callback) {
  const old = document.getElementById('transferMenu');
  if (old) old.remove();
  const menu = document.createElement('div');
  menu.id = 'transferMenu';
  menu.style.cssText = 'position:fixed;z-index:1000;background:#2a2a2a;border:1px solid #555;border-radius:6px;padding:8px;box-shadow:0 4px 20px rgba(0,0,0,0.6);left:50%;top:50%;transform:translate(-50%,-50%);min-width:200px;';
  var title = document.createElement('div');
  title.textContent = '选择传送目标:';
  title.style.cssText = 'color:#999;font-size:12px;margin-bottom:6px;';
  menu.appendChild(title);
  trs.forEach(tr => {
    const item = document.createElement('div');
    item.style.cssText = 'padding:6px 10px;margin:2px 0;background:#333;border-radius:4px;cursor:pointer;color:#ccc;font-size:13px;';
    item.textContent = '→ Map' + tr.tid + ' (' + tr.tx + ',' + tr.ty + ')';
    item.addEventListener('mouseenter', function(){this.style.background='#444';});
    item.addEventListener('mouseleave', function(){this.style.background='#333';});
    item.addEventListener('click', function(e) { e.stopPropagation(); menu.remove(); callback(tr); });
    menu.appendChild(item);
  });
  var close = document.createElement('div');
  close.textContent = '✕ 取消';
  close.style.cssText = 'padding:6px 10px;margin-top:4px;text-align:center;color:#888;font-size:12px;cursor:pointer;';
  close.addEventListener('click', function(){menu.remove();});
  menu.appendChild(close);
  document.body.appendChild(menu);
}

function updateUI() {
  drawGrid();
  const list = document.getElementById('selList');
  list.innerHTML = '';
  selections.forEach((s, i) => {
    const li = document.createElement('li');
    li.innerHTML = '<span>(' + s.absX + ',' + s.absY + ')' + (s.mapId ? ' Map' + s.mapId : '') + '</span><span class="del" data-i="' + i + '">✕</span>';
    li.querySelector('.del').addEventListener('click', function(e) {
      e.stopPropagation();
      selections.splice(parseInt(this.dataset.i), 1);
      updateUI();
    });
    list.appendChild(li);
  });
  document.getElementById('selStatus').textContent = selections.length + ' 个格子已选择';
}

// ─── 缩放 ─────────────────────────────────────────────────────
document.getElementById('scrollArea').addEventListener('wheel', function(e) {
  e.preventDefault();
  const rect = this.getBoundingClientRect();
  const factor = e.deltaY > 0 ? 1/1.15 : 1.15;
  const oldZ = zoom;
  zoom = Math.max(0.05, Math.min(10, zoom * factor));
  const ratio = zoom / oldZ;
  this.scrollLeft = (this.scrollLeft + e.clientX - rect.left) * ratio - (e.clientX - rect.left);
  this.scrollTop = (this.scrollTop + e.clientY - rect.top) * ratio - (e.clientY - rect.top);
  applyZoom();
}, { passive: false });

// ─── 中键拖拽平移 ──────────────────────────────────────────
(function() {
  let panning = false, startX, startY, startLeft, startTop;
  const area = document.getElementById('scrollArea');
  area.addEventListener('mousedown', function(e) {
    if (e.button === 1) {
      e.preventDefault();
      panning = true;
      startX = e.clientX;
      startY = e.clientY;
      startLeft = this.scrollLeft;
      startTop = this.scrollTop;
      this.style.cursor = 'grabbing';
    }
  });
  document.addEventListener('mousemove', function(e) {
    if (!panning) return;
    e.preventDefault();
    area.scrollLeft = startLeft - (e.clientX - startX);
    area.scrollTop = startTop - (e.clientY - startY);
  });
  document.addEventListener('mouseup', function(e) {
    if (e.button === 1 && panning) {
      panning = false;
      area.style.cursor = '';
    }
  });
  // 防止中键点击弹出自动滚动图标
  area.addEventListener('auxclick', function(e) { if (e.button === 1) e.preventDefault(); });
})();

document.addEventListener('keydown', function(e) {
  const area = document.getElementById('scrollArea');
  const rect = area.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  if (e.ctrlKey && e.key === '=') { e.preventDefault(); zoom = Math.max(0.05, Math.min(10, zoom * 1.3)); applyZoom(); }
  if (e.ctrlKey && e.key === '-') { e.preventDefault(); zoom = Math.max(0.05, Math.min(10, zoom / 1.3)); applyZoom(); }
  if (e.ctrlKey && e.key === '0') { e.preventDefault(); zoom = 1; applyZoom(); }
});

// ─── 事件绑定 ─────────────────────────────────────────────────
document.getElementById('clearSel').addEventListener('click', function() { selections = []; updateUI(); });
document.getElementById('showGrid').addEventListener('change', drawGrid);
document.getElementById('showLabels').addEventListener('change', drawGrid);
document.getElementById('showTransfers').addEventListener('change', drawGrid);
document.getElementById('mapSelect').addEventListener('change', function() { if (_skipSelectChange) { _skipSelectChange = false; return; } if (this.value) loadMap(this.value); });
document.getElementById('saveBtn').addEventListener('click', function() {
  const blob = new Blob([JSON.stringify(selections, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'selections.json';
  a.click();
});
document.getElementById('copyBtn').addEventListener('click', function() {
  const data = JSON.stringify(selections, null, 2);
  document.getElementById('jsonPreview').value = data;
  navigator.clipboard.writeText(data);
});
document.getElementById('exportTransferBtn').addEventListener('click', function() {
  const blob = new Blob([JSON.stringify(TRANSFERS, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'transfers.json';
  a.click();
});

// ─── 启动 ─────────────────────────────────────────────────────
loadData();
</script>
</body>
</html>
